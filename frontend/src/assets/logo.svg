<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Indigo Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e21e6" />
      <stop offset="100%" stop-color="#3b15c9" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Clean Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" filter="url(#subtleGlow)" />

  <!-- Brain Icon matching reference exactly -->
  <g fill="#ffffff" transform="translate(256, 126)">
    <!-- Top Brain Lobes (Smooth, filled & textured) -->
    <!-- Center Dividing Line -->
    <!-- Left Half of Brain -->
    <path d="M -4, -62 C -18, -62 -32, -54 -40, -42 C -52, -42 -64, -30 -66, -16 C -74, -14 -80, -4 -80, 8 C -80, 22 -70, 34 -58, 36 C -60, 46 -52, 58 -40, 62 C -26, 66 -12, 60 -4, 52 Z" />
    <!-- Right Half of Brain -->
    <path d="M 4, -62 C 18, -62 32, -54 40, -42 C 52, -42 64, -30 66, -16 C 74, -14 80, -4 80, 8 C 80, 22 70, 34 58, 36 C 60, 46 52, 58 40, 62 C 26, 66 12, 60 4, 52 Z" />

    <!-- Brain Fissures / Inner Carvings (Purple Cutouts) -->
    <!-- Horizontal divide between top & bottom lobes -->
    <path d="M -76, 8 L 76, 8" stroke="#4e21e6" stroke-width="7" stroke-linecap="round" />
    <path d="M 0, -60 L 0, 52" stroke="#4e21e6" stroke-width="6" />

    <!-- Left fissures -->
    <path d="M -36, -34 C -24, -28 -24, -12 -38, -6 C -48, -2 -54, 4 -48, 8" 
          fill="none" stroke="#4e21e6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -48, 8 C -54, 18 -44, 30 -30, 26 C -20, 24 -16, 36 -24, 46" 
          fill="none" stroke="#4e21e6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right fissures -->
    <path d="M 36, -34 C 24, -28 24, -12 38, -6 C 48, -2 54, 4 48, 8" 
          fill="none" stroke="#4e21e6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 48, 8 C 54, 18 44, 30 30, 26 C 20, 24 16, 36 24, 46" 
          fill="none" stroke="#4e21e6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Big Serif 'H' from Reference -->
  <g fill="#ffffff">
    <!-- Left Vertical Stem + Serifs -->
    <rect x="194" y="214" width="22" height="152" />
    <!-- Top Left Serif (bracketed) -->
    <path d="M 156 214 L 232 214 C 220 214 216 218 216 226 L 216 230 L 194 230 L 194 226 C 194 218 190 214 178 214 L 156 214 Z" />
    <polygon points="156,214 232,214 232,224 216,224 216,224 194,224 172,224 156,224" />
    <!-- Bottom Left Serif -->
    <polygon points="156,366 232,366 232,356 216,356 216,356 194,356 172,356 156,356" />

    <!-- Right Vertical Stem + Serifs -->
    <rect x="296" y="214" width="22" height="152" />
    <!-- Top Right Serif -->
    <polygon points="258,214 334,214 334,224 318,224 318,224 296,224 274,224 258,224" />
    <!-- Bottom Right Serif -->
    <polygon points="258,366 334,366 334,356 318,356 318,356 296,356 274,356 258,356" />

    <!-- Horizontal Crossbar -->
    <rect x="216" y="280" width="80" height="20" />
  </g>

  <!-- 'HireMind' Serif Typography matching reference -->
  <text x="256" y="432" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="'Georgia', 'Times New Roman', 'Baskerville', serif" 
        font-size="46" 
        font-weight="700" 
        letter-spacing="0.5">HireMind</text>
</svg>
